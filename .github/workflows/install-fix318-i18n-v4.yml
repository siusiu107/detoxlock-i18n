name: Install DetoxLock FIX318 language packs v4

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: install-detoxlock-fix318-i18n-v4
  cancel-in-progress: false

jobs:
  install:
    if: github.event.issue.title == 'INSTALL_DETOXLOCK_FIX318_I18N_V4_PAYLOAD'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read and verify base language delta
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .fix318-base-v2
          jq -r '.issue.body' "$GITHUB_EVENT_PATH" | tr -d '\r\n ' > .fix318-base-v2/full.b64
          echo '72170b32ecc1ccf11a4856b55b5f3aeb6f029ceb7874a0c0255f7b7cecde95ee  .fix318-base-v2/full.b64' | sha256sum -c -

      - name: Generate and verify direct v4 packs
        run: python3 tools/install_fix318_v4.py

      - name: Commit direct v4 packs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish DetoxLock direct language packs v4'
          git push origin HEAD:main

      - name: Close trigger issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --comment 'Direct v4 language packs installed and verified: 12 languages, 2,329 keys each.'
