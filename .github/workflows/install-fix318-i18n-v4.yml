name: Install DetoxLock FIX318 language packs v4

on:
  issues:
    types: [opened]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: install-detoxlock-fix318-i18n-v4
  cancel-in-progress: false

jobs:
  install:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.title == 'INSTALL_DETOXLOCK_FIX318_I18N_V4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate and verify direct v4 packs
        run: python3 tools/install_fix318_v4.py

      - name: Commit direct v4 packs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish DetoxLock direct language packs v4'
          git push origin HEAD:main

      - name: Close trigger issue
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close '${{ github.event.issue.number }}' --repo "$GITHUB_REPOSITORY" --comment 'Direct v4 language packs installed and verified: 12 languages, 2,329 keys each.'
