name: Patch FIX324 key count

on:
  push:
    branches: [main]
    paths:
      - '.patch-fix324-key-count/READY'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Accept four new quick-lock resource keys
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/fix324-repair-ui-keys-v6-pr.yml')
          text = path.read_text(encoding='utf-8')
          assert text.count('== 2329') == 2
          path.write_text(text.replace('== 2329', '== 2333'), encoding='utf-8')
          PY
          rm -rf .patch-fix324-key-count
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github/workflows/fix324-repair-ui-keys-v6-pr.yml .patch-fix324-key-count
          git commit -m 'Allow four new FIX324 quick-lock translation keys [skip ci]'
          git push origin HEAD:main
