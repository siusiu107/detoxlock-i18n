name: Publish FIX326 natural tutorial translations v8

on:
  pull_request:
    branches: [main]
    paths:
      - '.fix326-i18n-trigger/**'

permissions:
  contents: write

concurrency:
  group: fix326-tutorial-i18n-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply manually curated tutorial wording and publish v8
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json

          KEYS = {
              'main': 'hc_adfb1841afd01e670724',
              'permissions': 'hc_5c0aed85a7f270960629',
              'first_setup': 'hc_dfa126b34bfcb95b2ff1',
              'quick': 'hc_429764d3a5ddb5ceeb47',
              'limits': 'hc_49172299cae9c6b8fa13',
              'study_stats': 'hc_1bcc2e40b132fa9905b4',
          }
          VALUES = {
              'en': {
                  'main': 'Main locking methods',
                  'permissions': 'Why these permissions are required',
                  'first_setup': 'Initial setup steps',
                  'quick': 'Quick lock',
                  'limits': 'Time, app, and short-form limits',
                  'study_stats': 'Study mode, statistics, and settings',
              },
              'ko': {
                  'main': '주요 잠금 방식',
                  'permissions': '필수 권한이 필요한 이유',
                  'first_setup': '처음 설정하는 순서',
                  'quick': '빠른 잠금',
                  'limits': '시간·앱·숏폼 제한',
                  'study_stats': '공신폰·통계·설정',
              },
              'ja': {
                  'main': '主なロック方法',
                  'permissions': 'これらの権限が必要な理由',
                  'first_setup': '初回設定の手順',
                  'quick': 'クイックロック',
                  'limits': '時間・アプリ・ショート動画の制限',
                  'study_stats': '集中スマホ・統計・設定',
              },
              'zh-CN': {
                  'main': '主要锁定方式',
                  'permissions': '为什么需要这些权限',
                  'first_setup': '首次设置步骤',
                  'quick': '快速锁定',
                  'limits': '使用时长、应用和短视频限制',
                  'study_stats': '专注手机、统计与设置',
              },
              'zh-TW': {
                  'main': '主要鎖定方式',
                  'permissions': '為什麼需要這些權限',
                  'first_setup': '初次設定步驟',
                  'quick': '快速鎖定',
                  'limits': '使用時間、應用程式與短影音限制',
                  'study_stats': '專注手機、統計與設定',
              },
              'es': {
                  'main': 'Métodos principales de bloqueo',
                  'permissions': 'Por qué se necesitan estos permisos',
                  'first_setup': 'Pasos de la configuración inicial',
                  'quick': 'Bloqueo rápido',
                  'limits': 'Límites de tiempo, aplicaciones y vídeos cortos',
                  'study_stats': 'Modo de estudio, estadísticas y ajustes',
              },
              'fr': {
                  'main': 'Principaux modes de verrouillage',
                  'permissions': 'Pourquoi ces autorisations sont nécessaires',
                  'first_setup': 'Étapes de la configuration initiale',
                  'quick': 'Verrouillage rapide',
                  'limits': 'Limites de temps, d’applications et de vidéos courtes',
                  'study_stats': 'Mode Études, statistiques et paramètres',
              },
              'de': {
                  'main': 'Wichtigste Sperrmethoden',
                  'permissions': 'Warum diese Berechtigungen erforderlich sind',
                  'first_setup': 'Schritte der Ersteinrichtung',
                  'quick': 'Schnellsperre',
                  'limits': 'Zeit-, App- und Kurzvideo-Limits',
                  'study_stats': 'Lernmodus, Statistiken und Einstellungen',
              },
              'pt-BR': {
                  'main': 'Principais formas de bloqueio',
                  'permissions': 'Por que essas permissões são necessárias',
                  'first_setup': 'Etapas da configuração inicial',
                  'quick': 'Bloqueio rápido',
                  'limits': 'Limites de tempo, apps e vídeos curtos',
                  'study_stats': 'Modo de estudo, estatísticas e configurações',
              },
              'id': {
                  'main': 'Metode penguncian utama',
                  'permissions': 'Mengapa izin ini diperlukan',
                  'first_setup': 'Langkah penyiapan awal',
                  'quick': 'Kunci cepat',
                  'limits': 'Batas waktu, aplikasi, dan video pendek',
                  'study_stats': 'Mode belajar, statistik, dan pengaturan',
              },
              'vi': {
                  'main': 'Các cách khóa chính',
                  'permissions': 'Vì sao cần các quyền này',
                  'first_setup': 'Các bước thiết lập ban đầu',
                  'quick': 'Khóa nhanh',
                  'limits': 'Giới hạn thời gian, ứng dụng và video ngắn',
                  'study_stats': 'Chế độ học tập, thống kê và cài đặt',
              },
              'th': {
                  'main': 'วิธีล็อกหลัก',
                  'permissions': 'เหตุผลที่ต้องใช้สิทธิ์เหล่านี้',
                  'first_setup': 'ขั้นตอนการตั้งค่าครั้งแรก',
                  'quick': 'ล็อกด่วน',
                  'limits': 'จำกัดเวลา แอป และวิดีโอสั้น',
                  'study_stats': 'โหมดเรียน สถิติ และการตั้งค่า',
              },
          }

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert set(manifest['languages']) == set(VALUES)
          expected_count = None

          for tag, meta in manifest['languages'].items():
              path = Path(meta['file'])
              obj = json.loads(gzip.decompress(path.read_bytes()).decode('utf-8'))
              translations = obj['translations']
              for label, remote_key in KEYS.items():
                  assert remote_key in translations, (tag, remote_key)
                  translations[remote_key] = VALUES[tag][label]
              if expected_count is None:
                  expected_count = len(translations)
              assert len(translations) == expected_count
              payload = {
                  'schemaVersion': 1,
                  'locale': tag,
                  'version': 8,
                  'translations': translations,
              }
              decoded = json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              encoded = gzip.compress(decoded, compresslevel=9, mtime=0)
              path.write_bytes(encoded)
              meta.update({
                  'version': 8,
                  'sha256': hashlib.sha256(encoded).hexdigest(),
                  'size': len(encoded),
                  'translationCount': len(translations),
                  'encoding': 'gzip',
                  'uncompressedSize': len(decoded),
              })

          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          print(f'OK: published manually curated tutorial wording in {len(VALUES)} v8 language packs')
          PY

      - name: Verify v8 language packs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json
          keys = [
              'hc_adfb1841afd01e670724', 'hc_5c0aed85a7f270960629',
              'hc_dfa126b34bfcb95b2ff1', 'hc_429764d3a5ddb5ceeb47',
              'hc_49172299cae9c6b8fa13', 'hc_1bcc2e40b132fa9905b4',
          ]
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          counts = set()
          for tag, meta in manifest['languages'].items():
              raw = Path(meta['file']).read_bytes()
              decoded = gzip.decompress(raw)
              obj = json.loads(decoded.decode('utf-8'))
              assert obj['version'] == meta['version'] == 8, tag
              assert obj['locale'] == tag
              assert hashlib.sha256(raw).hexdigest() == meta['sha256']
              assert len(raw) == meta['size']
              assert len(decoded) == meta['uncompressedSize']
              for key in keys:
                  assert obj['translations'][key].strip(), (tag, key)
              assert len(obj['translations']) == meta['translationCount']
              counts.add(len(obj['translations']))
          assert len(counts) == 1, counts
          print('OK: all v8 packs, curated values, and manifest hashes verified')
          PY

      - name: Commit v8 packs to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .fix326-i18n-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A manifest.json locales .fix326-i18n-trigger
          git commit -m 'Publish FIX326 curated tutorial translations v8 [skip ci]'
          git push origin HEAD:"$GITHUB_HEAD_REF"
