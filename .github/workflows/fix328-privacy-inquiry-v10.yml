name: Publish FIX328 privacy inquiry translations v10

on:
  pull_request:
    branches: [main]
    paths:
      - '.fix328-i18n-trigger/**'

permissions:
  contents: write

concurrency:
  group: fix328-privacy-i18n-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Add curated privacy-contact resource and publish v10
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json

          VALUES = {
              'en': '🔒 Privacy-related inquiry',
              'ko': '🔒 개인정보 관련 문의',
              'ja': '🔒 個人情報に関するお問い合わせ',
              'zh-CN': '🔒 个人信息相关咨询',
              'zh-TW': '🔒 個人資料相關諮詢',
              'es': '🔒 Consulta sobre privacidad',
              'fr': '🔒 Demande relative à la vie privée',
              'de': '🔒 Datenschutzanfrage',
              'pt-BR': '🔒 Solicitação sobre privacidade',
              'id': '🔒 Pertanyaan terkait privasi',
              'vi': '🔒 Yêu cầu về quyền riêng tư',
              'th': '🔒 สอบถามเกี่ยวกับความเป็นส่วนตัว',
          }

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert set(manifest['languages']) == set(VALUES)
          expected_count = None

          for tag, meta in manifest['languages'].items():
              locale_path = Path(meta['file'])
              obj = json.loads(gzip.decompress(locale_path.read_bytes()).decode('utf-8'))
              translations = obj['translations']
              translations['res.settings_privacy_inquiry'] = VALUES[tag]
              if expected_count is None:
                  expected_count = len(translations)
              assert len(translations) == expected_count, (tag, len(translations), expected_count)
              payload = {
                  'schemaVersion': 1,
                  'locale': tag,
                  'version': 10,
                  'translations': translations,
              }
              decoded = json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              packed = gzip.compress(decoded, compresslevel=9, mtime=0)
              locale_path.write_bytes(packed)
              meta.update({
                  'version': 10,
                  'sha256': hashlib.sha256(packed).hexdigest(),
                  'size': len(packed),
                  'translationCount': len(translations),
                  'encoding': 'gzip',
                  'uncompressedSize': len(decoded),
              })

          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, separators=(',', ':')) + '\n',
              encoding='utf-8',
          )

          refreshed = json.loads(manifest_path.read_text(encoding='utf-8'))
          for tag, meta in refreshed['languages'].items():
              packed = Path(meta['file']).read_bytes()
              assert hashlib.sha256(packed).hexdigest() == meta['sha256'], tag
              assert len(packed) == meta['size'], tag
              obj = json.loads(gzip.decompress(packed).decode('utf-8'))
              assert obj['version'] == 10, tag
              assert obj['translations']['res.settings_privacy_inquiry'] == VALUES[tag], tag
              assert len(obj['translations']) == meta['translationCount'] == expected_count, tag
          print(f'OK: 12 curated privacy-contact translations published; {expected_count} keys each')
          PY

      - name: Commit v10 language packs to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .fix328-i18n-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .fix328-i18n-trigger manifest.json locales
          git commit -m 'Publish curated privacy inquiry translations v10 [skip ci]'
          git push origin HEAD:"$GITHUB_HEAD_REF"
