                  'protection_safe_mode_title': '已阻止进入安全模式',
                  'protection_safe_mode_subtitle': '锁定或限制生效期间，无法通过安全模式绕过保护。',
                  'protection_safe_mode_detail': '已关闭安全模式进入页面并恢复锁定界面。如需解除保护，请使用 DetoxLock 应用内的正式解除入口。',
                  'device_admin_disable_warning': 'DetoxLock 保护生效期间，无法直接在系统设置中停用设备管理权限。请使用 DetoxLock 应用内的正式解除入口。',
              },
              'zh-TW': {
                  'protection_notice_badge': 'DetoxLock 保護',
                  'common_confirm': '確定',
                  'protection_device_admin_title': '已阻止停用裝置管理員權限',
                  'protection_device_admin_subtitle': '鎖定或限制生效期間，無法關閉 DetoxLock 的裝置管理員權限。',
                  'protection_device_admin_detail': '已準確偵測到 DetoxLock 專用保護字串，並從停用頁面返回。不會阻擋其他應用程式的裝置管理員設定。如需停用，請使用 DetoxLock 應用程式內的正式解除入口。',
                  'protection_safe_mode_title': '已阻止進入安全模式',
                  'protection_safe_mode_subtitle': '鎖定或限制生效期間，無法透過安全模式繞過保護。',
                  'protection_safe_mode_detail': '已關閉安全模式進入頁面並恢復鎖定畫面。如需解除保護，請使用 DetoxLock 應用程式內的正式解除入口。',
                  'device_admin_disable_warning': 'DetoxLock 保護生效期間，無法直接在系統設定中停用裝置管理員權限。請使用 DetoxLock 應用程式內的正式解除入口。',
              },
              'es': {
                  'protection_notice_badge': 'Protección de DetoxLock',
                  'common_confirm': 'Confirmar',
                  'protection_device_admin_title': 'Se bloqueó la desactivación del administrador del dispositivo',
                  'protection_device_admin_subtitle': 'No puedes desactivar el permiso de administrador del dispositivo de DetoxLock mientras haya un bloqueo o una restricción activa.',
                  'protection_device_admin_detail': 'Se detectó correctamente la cadena de protección exclusiva de DetoxLock y se salió de la pantalla de desactivación. La configuración de administrador de otras aplicaciones no se bloquea. Para desactivarlo, usa la opción oficial dentro de DetoxLock.',
                  'protection_safe_mode_title': 'Se bloqueó el acceso al modo seguro',
                  'protection_safe_mode_subtitle': 'El modo seguro no puede usarse para eludir DetoxLock mientras haya un bloqueo o una restricción activa.',
                  'protection_safe_mode_detail': 'Se cerró la pantalla de acceso al modo seguro y se restauró la pantalla de bloqueo. Para desactivar la protección, usa la opción oficial dentro de DetoxLock.',
                  'device_admin_disable_warning': 'Mientras la protección de DetoxLock esté activa, el permiso de administrador del dispositivo no puede desactivarse directamente desde los ajustes del sistema. Usa la opción oficial dentro de DetoxLock.',
              },
              'fr': {
                  'protection_notice_badge': 'Protection DetoxLock',
                  'common_confirm': 'Confirmer',
                  'protection_device_admin_title': 'Désactivation de l’administrateur de l’appareil bloquée',
                  'protection_device_admin_subtitle': 'Vous ne pouvez pas désactiver l’autorisation d’administrateur de l’appareil de DetoxLock tant qu’un verrouillage ou une restriction est actif.',
                  'protection_device_admin_detail': 'La chaîne de protection propre à DetoxLock a été détectée avec précision et l’écran de désactivation a été fermé. Les réglages d’administrateur des autres applications ne sont pas bloqués. Pour désactiver cette autorisation, utilisez l’option officielle dans DetoxLock.',
                  'protection_safe_mode_title': 'Accès au mode sans échec bloqué',
                  'protection_safe_mode_subtitle': 'Le mode sans échec ne peut pas être utilisé pour contourner DetoxLock tant qu’un verrouillage ou une restriction est actif.',
                  'protection_safe_mode_detail': 'L’écran d’accès au mode sans échec a été fermé et l’écran de verrouillage a été rétabli. Pour désactiver la protection, utilisez l’option officielle dans DetoxLock.',
                  'device_admin_disable_warning': 'Tant que la protection DetoxLock est active, l’autorisation d’administrateur de l’appareil ne peut pas être désactivée directement dans les réglages système. Utilisez l’option officielle dans DetoxLock.',
              },
              'de': {
                  'protection_notice_badge': 'DetoxLock-Schutz',
                  'common_confirm': 'Bestätigen',
                  'protection_device_admin_title': 'Deaktivierung der Geräteverwaltung blockiert',
                  'protection_device_admin_subtitle': 'Die Geräteadministrator-Berechtigung von DetoxLock kann nicht deaktiviert werden, solange eine Sperre oder Einschränkung aktiv ist.',
                  'protection_device_admin_detail': 'Die eindeutige DetoxLock-Schutzzeichenfolge wurde erkannt und der Deaktivierungsbildschirm wurde verlassen. Die Geräteadministratoreinstellungen anderer Apps werden nicht blockiert. Verwende zum Deaktivieren die offizielle Option in DetoxLock.',
                  'protection_safe_mode_title': 'Start im abgesicherten Modus blockiert',
                  'protection_safe_mode_subtitle': 'Der abgesicherte Modus kann nicht zum Umgehen von DetoxLock verwendet werden, solange eine Sperre oder Einschränkung aktiv ist.',
                  'protection_safe_mode_detail': 'Der Bildschirm zum Starten des abgesicherten Modus wurde geschlossen und der Sperrbildschirm wiederhergestellt. Verwende zum Aufheben des Schutzes die offizielle Option in DetoxLock.',
                  'device_admin_disable_warning': 'Solange der DetoxLock-Schutz aktiv ist, kann die Geräteadministrator-Berechtigung nicht direkt in den Systemeinstellungen deaktiviert werden. Verwende die offizielle Option in DetoxLock.',
              },
              'pt-BR': {
                  'protection_notice_badge': 'Proteção do DetoxLock',
                  'common_confirm': 'Confirmar',
                  'protection_device_admin_title': 'Desativação do administrador do dispositivo bloqueada',
                  'protection_device_admin_subtitle': 'Não é possível desativar a permissão de administrador do dispositivo do DetoxLock enquanto um bloqueio ou uma restrição estiver ativo.',
                  'protection_device_admin_detail': 'A sequência exclusiva de proteção do DetoxLock foi detectada corretamente e a tela de desativação foi fechada. As configurações de administrador de outros apps não são bloqueadas. Para desativar, use a opção oficial no DetoxLock.',
                  'protection_safe_mode_title': 'Entrada no modo de segurança bloqueada',
                  'protection_safe_mode_subtitle': 'O modo de segurança não pode ser usado para contornar o DetoxLock enquanto um bloqueio ou uma restrição estiver ativo.',
                  'protection_safe_mode_detail': 'A tela de entrada no modo de segurança foi fechada e a tela de bloqueio foi restaurada. Para desativar a proteção, use a opção oficial no DetoxLock.',
                  'device_admin_disable_warning': 'Enquanto a proteção do DetoxLock estiver ativa, a permissão de administrador do dispositivo não poderá ser desativada diretamente nas configurações do sistema. Use a opção oficial no DetoxLock.',
              },
              'id': {
                  'protection_notice_badge': 'Perlindungan DetoxLock',
                  'common_confirm': 'Konfirmasi',
                  'protection_device_admin_title': 'Penonaktifan administrator perangkat diblokir',
                  'protection_device_admin_subtitle': 'Izin administrator perangkat DetoxLock tidak dapat dinonaktifkan saat kunci atau pembatasan sedang aktif.',
                  'protection_device_admin_detail': 'String perlindungan khusus DetoxLock terdeteksi dengan tepat dan layar penonaktifan telah ditutup. Pengaturan administrator perangkat aplikasi lain tidak diblokir. Untuk menonaktifkannya, gunakan opsi resmi di dalam DetoxLock.',
                  'protection_safe_mode_title': 'Masuk ke mode aman diblokir',
                  'protection_safe_mode_subtitle': 'Mode aman tidak dapat digunakan untuk melewati DetoxLock saat kunci atau pembatasan sedang aktif.',
                  'protection_safe_mode_detail': 'Layar masuk ke mode aman telah ditutup dan layar kunci dipulihkan. Untuk menonaktifkan perlindungan, gunakan opsi resmi di dalam DetoxLock.',
                  'device_admin_disable_warning': 'Saat perlindungan DetoxLock aktif, izin administrator perangkat tidak dapat dinonaktifkan langsung dari pengaturan sistem. Gunakan opsi resmi di dalam DetoxLock.',
              },
              'vi': {
                  'protection_notice_badge': 'Bảo vệ DetoxLock',
                  'common_confirm': 'Xác nhận',
                  'protection_device_admin_title': 'Đã chặn việc tắt quyền quản trị thiết bị',
                  'protection_device_admin_subtitle': 'Không thể tắt quyền quản trị thiết bị của DetoxLock khi đang có khóa hoặc giới hạn hoạt động.',
                  'protection_device_admin_detail': 'Đã nhận diện chính xác chuỗi bảo vệ riêng của DetoxLock và thoát khỏi màn hình tắt quyền. Cài đặt quản trị thiết bị của ứng dụng khác không bị chặn. Để tắt quyền, hãy dùng mục gỡ bảo vệ chính thức trong DetoxLock.',
                  'protection_safe_mode_title': 'Đã chặn vào chế độ an toàn',
                  'protection_safe_mode_subtitle': 'Không thể dùng chế độ an toàn để vượt qua DetoxLock khi đang có khóa hoặc giới hạn hoạt động.',
                  'protection_safe_mode_detail': 'Đã đóng màn hình vào chế độ an toàn và khôi phục màn hình khóa. Để gỡ bảo vệ, hãy dùng mục chính thức trong DetoxLock.',
                  'device_admin_disable_warning': 'Khi tính năng bảo vệ DetoxLock đang hoạt động, bạn không thể tắt quyền quản trị thiết bị trực tiếp trong cài đặt hệ thống. Hãy dùng mục chính thức trong DetoxLock.',
              },
              'th': {
                  'protection_notice_badge': 'การป้องกันของ DetoxLock',
                  'common_confirm': 'ยืนยัน',
                  'protection_device_admin_title': 'บล็อกการปิดสิทธิ์ผู้ดูแลอุปกรณ์แล้ว',
                  'protection_device_admin_subtitle': 'ไม่สามารถปิดสิทธิ์ผู้ดูแลอุปกรณ์ของ DetoxLock ได้ขณะมีการล็อกหรือข้อจำกัดทำงานอยู่',
                  'protection_device_admin_detail': 'ตรวจพบสตริงป้องกันเฉพาะของ DetoxLock อย่างถูกต้องและออกจากหน้าปิดสิทธิ์แล้ว การตั้งค่าผู้ดูแลอุปกรณ์ของแอปอื่นจะไม่ถูกบล็อก หากต้องการปิดสิทธิ์ ให้ใช้เมนูอย่างเป็นทางการภายใน DetoxLock',
                  'protection_safe_mode_title': 'บล็อกการเข้าสู่เซฟโหมดแล้ว',
                  'protection_safe_mode_subtitle': 'ไม่สามารถใช้เซฟโหมดเพื่อข้าม DetoxLock ได้ขณะมีการล็อกหรือข้อจำกัดทำงานอยู่',
                  'protection_safe_mode_detail': 'ปิดหน้าการเข้าสู่เซฟโหมดและคืนหน้าจอล็อกแล้ว หากต้องการยกเลิกการป้องกัน ให้ใช้เมนูอย่างเป็นทางการภายใน DetoxLock',
                  'device_admin_disable_warning': 'ขณะที่การป้องกันของ DetoxLock ทำงานอยู่ จะไม่สามารถปิดสิทธิ์ผู้ดูแลอุปกรณ์โดยตรงจากการตั้งค่าระบบได้ โปรดใช้เมนูอย่างเป็นทางการภายใน DetoxLock',
              },
          }

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert set(manifest['languages']) == set(VALUES)
          expected_count = None
          required = {f'res.{name}' for name in next(iter(VALUES.values()))}

          for tag, meta in manifest['languages'].items():
              locale_path = Path(meta['file'])
              obj = json.loads(gzip.decompress(locale_path.read_bytes()).decode('utf-8'))
              translations = obj['translations']
              for name, value in VALUES[tag].items():
                  translations[f'res.{name}'] = value
              if expected_count is None:
                  expected_count = len(translations)
              assert len(translations) == expected_count, (tag, len(translations), expected_count)
              assert required.issubset(translations), tag
              payload = {
                  'schemaVersion': 1,
                  'locale': tag,
                  'version': 11,
                  'translations': translations,
              }
              decoded = json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              packed = gzip.compress(decoded, compresslevel=9, mtime=0)
              locale_path.write_bytes(packed)
              meta.update({
                  'version': 11,
                  'sha256': hashlib.sha256(packed).hexdigest(),
                  'size': len(packed),
                  'translationCount': len(translations),
                  'encoding': 'gzip',
                  'uncompressedSize': len(decoded),
              })

          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')

          refreshed = json.loads(manifest_path.read_text(encoding='utf-8'))
          for tag, meta in refreshed['languages'].items():
              packed = Path(meta['file']).read_bytes()
              assert hashlib.sha256(packed).hexdigest() == meta['sha256'], tag
              assert len(packed) == meta['size'], tag
              obj = json.loads(gzip.decompress(packed).decode('utf-8'))
              assert obj['version'] == 11, tag
              assert len(obj['translations']) == meta['translationCount'] == expected_count, tag
              for name, value in VALUES[tag].items():
                  assert obj['translations'][f'res.{name}'] == value, (tag, name)
          print(f'OK: 12 curated protection notice packs published; {expected_count} keys each')
          PY

      - name: Commit v11 language packs to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .fix330-i18n-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .fix330-i18n-trigger manifest.json locales
          git commit -m 'Publish curated FIX330 protection translations v11 [skip ci]'
          git push origin HEAD:"$GITHUB_HEAD_REF"
