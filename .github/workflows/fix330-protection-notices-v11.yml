                  'protection_safe_mode_title': '안전모드 진입을 차단했어요',
                  'protection_safe_mode_subtitle': '잠금 또는 제한이 적용 중인 동안에는 안전모드로 우회할 수 없어요.',
                  'protection_safe_mode_detail': '안전모드 진입 화면을 닫고 잠금 화면으로 돌아왔습니다. 보호 해제가 필요하면 DetoxLock 앱의 공식 해제 경로를 이용해주세요.',
                  'device_admin_disable_warning': 'DetoxLock 보호 중에는 시스템 설정에서 기기 관리자 권한을 직접 해제할 수 없습니다. DetoxLock 앱의 공식 해제 경로를 이용해주세요.',
