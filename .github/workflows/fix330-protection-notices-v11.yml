name: Publish FIX330 protection notice translations v11

on:
  pull_request:
    branches: [main]
    paths:
      - '.fix330-i18n-trigger/**'

permissions:
  contents: write

concurrency:
  group: fix330-protection-i18n-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Add curated protection translations and publish v11
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json

          VALUES = {
