                  'protection_device_admin_detail': "We detected DetoxLock’s unique protection marker and returned from the deactivation screen. Other apps’ device administrator settings are not blocked. To disable it, use the official deactivation option in DetoxLock.",
                  'protection_safe_mode_title': 'Safe mode entry blocked',
                  'protection_safe_mode_subtitle': 'Safe mode can’t be used to bypass DetoxLock while a lock or restriction is active.',
                  'protection_safe_mode_detail': 'The safe mode entry screen was closed and the lock screen was restored. To disable protection, use the official option in DetoxLock.',
