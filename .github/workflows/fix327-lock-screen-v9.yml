name: Publish FIX327 lock-screen translations v9

on:
  pull_request:
    branches: [main]
    paths:
      - '.fix327-i18n-trigger/**'

permissions:
  contents: write

concurrency:
  group: fix327-lock-screen-i18n-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Add curated lock-screen resources and publish v9
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
