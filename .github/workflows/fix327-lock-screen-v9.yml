                  'lock_emergency_usage': 'Mở khóa khẩn cấp 5 phút: hôm nay %1$d/%2$d lần',
                  'duration_dhms': '%1$d ngày %2$d giờ %3$d phút %4$d giây',
                  'duration_hms': '%1$d giờ %2$d phút %3$d giây',
                  'duration_ms': '%1$d phút %2$d giây',
                  'duration_s': '%1$d giây',
                  'lock_source_manual_short': 'Khóa thủ công',
                  'lock_source_time_short': 'Khóa theo khung giờ',
                  'lock_source_daily_short': 'Giới hạn hằng ngày',
                  'lock_source_combined': '%1$s đang cùng hoạt động',
                  'lock_source_daily_active': 'Khóa do giới hạn hằng ngày đang bật',
                  'lock_source_time_active': 'Khóa theo khung giờ đang bật',
                  'lock_source_manual_active': 'Khóa thủ công đang bật',
                  'lock_source_focus_active': 'Khóa tập trung đang bật',
              },
              'th': {
                  'lock_remaining_long': 'เวลาที่เหลือ: %1$s',
                  'lock_emergency_usage': 'ปลดล็อกฉุกเฉิน 5 นาที: วันนี้ใช้ไป %1$d/%2$d ครั้ง',
                  'duration_dhms': '%1$d วัน %2$d ชั่วโมง %3$d นาที %4$d วินาที',
                  'duration_hms': '%1$d ชั่วโมง %2$d นาที %3$d วินาที',
                  'duration_ms': '%1$d นาที %2$d วินาที',
                  'duration_s': '%1$d วินาที',
                  'lock_source_manual_short': 'ล็อกด้วยตนเอง',
                  'lock_source_time_short': 'ล็อกตามช่วงเวลา',
                  'lock_source_daily_short': 'จำกัดเวลารายวัน',
                  'lock_source_combined': '%1$s กำลังทำงานพร้อมกัน',
                  'lock_source_daily_active': 'กำลังล็อกตามขีดจำกัดรายวัน',
                  'lock_source_time_active': 'กำลังล็อกตามช่วงเวลา',
                  'lock_source_manual_active': 'กำลังล็อกด้วยตนเอง',
                  'lock_source_focus_active': 'กำลังล็อกโหมดโฟกัส',
              },
          }

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          assert set(manifest['languages']) == set(VALUES)
          expected_count = None
          required_keys = {f'res.{name}' for name in next(iter(VALUES.values()))}

          for tag, meta in manifest['languages'].items():
              path = Path(meta['file'])
              obj = json.loads(gzip.decompress(path.read_bytes()).decode('utf-8'))
              translations = obj['translations']
              for name, value in VALUES[tag].items():
                  translations[f'res.{name}'] = value
              if expected_count is None:
                  expected_count = len(translations)
              assert len(translations) == expected_count, (tag, len(translations), expected_count)
              assert required_keys.issubset(translations), tag
              payload = {
                  'schemaVersion': 1,
                  'locale': tag,
                  'version': 9,
                  'translations': translations,
              }
              decoded = json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              encoded = gzip.compress(decoded, compresslevel=9, mtime=0)
              path.write_bytes(encoded)
              meta.update({
                  'version': 9,
                  'sha256': hashlib.sha256(encoded).hexdigest(),
                  'size': len(encoded),
                  'translationCount': len(translations),
                  'encoding': 'gzip',
                  'uncompressedSize': len(decoded),
              })

          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          print(f'OK: published {len(VALUES)} lock-screen language packs as v9 with {expected_count} translations each')
          PY

      - name: Verify v9 lock-screen language packs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json
          required = {
              'res.lock_remaining_long', 'res.lock_emergency_usage',
              'res.duration_dhms', 'res.duration_hms', 'res.duration_ms', 'res.duration_s',
              'res.lock_source_manual_short', 'res.lock_source_time_short', 'res.lock_source_daily_short',
              'res.lock_source_combined', 'res.lock_source_daily_active', 'res.lock_source_time_active',
              'res.lock_source_manual_active', 'res.lock_source_focus_active',
          }
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          counts = set()
          for tag, meta in manifest['languages'].items():
              raw = Path(meta['file']).read_bytes()
              decoded = gzip.decompress(raw)
              obj = json.loads(decoded.decode('utf-8'))
              assert obj['version'] == meta['version'] == 9, tag
              assert obj['locale'] == tag
              assert hashlib.sha256(raw).hexdigest() == meta['sha256']
              assert len(raw) == meta['size']
              assert len(decoded) == meta['uncompressedSize']
              assert required.issubset(obj['translations']), tag
              assert all(obj['translations'][key].strip() for key in required), tag
              assert len(obj['translations']) == meta['translationCount']
              counts.add(len(obj['translations']))
          assert len(counts) == 1, counts
          print('OK: all v9 lock-screen packs and manifest hashes verified')
          PY

      - name: Commit v9 packs to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .fix327-i18n-trigger
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A manifest.json locales .fix327-i18n-trigger
          git commit -m 'Publish FIX327 lock-screen language packs v9 [skip ci]'
          git push origin HEAD:"$GITHUB_HEAD_REF"
