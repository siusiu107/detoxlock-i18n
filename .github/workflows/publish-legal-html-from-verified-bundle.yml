name: Publish legal HTML from verified bundle

on:
  push:
    branches: [main]
    paths:
      - 'legal/PUBLISH_HTML'

permissions:
  contents: write

concurrency:
  group: publish-verified-legal-html
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode verified legal translations and render HTML
        shell: bash
        env:
          TERMS_TEMPLATE_GZIP_BASE64: ''
          PRIVACY_TEMPLATE_GZIP_BASE64: ''
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, html, json, os, re

          root = Path('legal')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          encoded = bytearray()
          for item in manifest['parts']:
              raw = (root / item['file']).read_bytes()
              assert len(raw) == item['size'], item['file']
              assert hashlib.sha256(raw).hexdigest() == item['sha256'], item['file']
              encoded.extend(raw)
          compressed = base64.b64decode(bytes(encoded), validate=False)
          assert len(compressed) == manifest['decodedSize']
          assert hashlib.sha256(compressed).hexdigest() == manifest['decodedSha256']
          translations = json.loads(gzip.decompress(compressed).decode('utf-8'))
          assert len(translations['ko']) == 151

          templates = {
              'terms_of_service': gzip.decompress(base64.b64decode(os.environ['TERMS_TEMPLATE_GZIP_BASE64'])).decode('utf-8'),
              'privacy_policy': gzip.decompress(base64.b64decode(os.environ['PRIVACY_TEMPLATE_GZIP_BASE64'])).decode('utf-8'),
          }
          dates = {
              'ja':'2026年6月27日','zh-CN':'2026年6月27日','zh-TW':'2026年6月27日',
              'es':'27 de junio de 2026','fr':'27 juin 2026','de':'27. Juni 2026',
              'pt-BR':'27 de junho de 2026','id':'27 Juni 2026',
              'vi':'27 tháng 6 năm 2026','th':'27 มิถุนายน 2026',
          }
          tags = ['ja','zh-CN','zh-TW','es','fr','de','pt-BR','id','vi','th']
          out = root / 'html'
          out.mkdir(parents=True, exist_ok=True)
          for old in out.glob('*.html'):
              old.unlink()

          placeholder = re.compile(r'\{\{T(\d+)\}\}')
          hangul = re.compile(r'[가-힣ㄱ-ㅎㅏ-ㅣ]')
          for tag in tags:
              assert len(translations[tag]) == 151
              for base_name, template in templates.items():
                  rendered = template.replace('lang="ko"', f'lang="{tag}"', 1)
                  def replace(match):
                      value = translations[tag][match.group(1)].strip()
                      value = value.replace('2026년 6월 27일', dates[tag])
                      assert value
                      return html.escape(value, quote=False)
                  rendered = placeholder.sub(replace, rendered)
                  assert '{{T' not in rendered
                  assert not hangul.search(rendered), (tag, base_name)
                  target = out / f'{base_name}.{tag}.html'
                  target.write_text(rendered, encoding='utf-8')
                  assert target.stat().st_size > 4000
          files = sorted(out.glob('*.html'))
          assert len(files) == 20, len(files)
          print('Published', len(files), 'external legal HTML documents')
          PY

      - name: Commit rendered documents
        shell: bash
        run: |
          set -euo pipefail
          rm -f legal/PUBLISH_HTML
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A legal/html legal/PUBLISH_HTML
          if ! git diff --cached --quiet; then
            git commit -m 'Publish verified external legal HTML [skip ci]'
            git push origin HEAD:main
          fi
