name: Repair FIX324 UI translations v6 corrected

on:
  pull_request:
    branches: [main]
    paths:
      - '.fix324-i18n-trigger2/**'

permissions:
  contents: write

jobs:
  patch-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Run corrected repair script
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/fix324-repair-ui-keys-v6-pr.yml').read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end]).replace('== 2329', '== 2333')
          exec(compile(script, 'fix324_repair_embedded.py', 'exec'), {})
          PY

      - name: Verify all v6 packs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          expected_tw = {
              'res.app_name': '數位戒癮鎖',
              'res.quick_lock_confirm_title': '開始鎖定？',
              'res.quick_lock_confirm_message': '鎖定會立即開始，並持續所選時間。現在開始嗎？',
              'res.quick_lock_confirm_positive': '開始鎖定',
              'res.quick_lock_confirm_negative': '取消',
              'hc.hc_8a69cea8d5387aa76d21': '這是最基本的頁面。想快速開始鎖定時，最常使用這個分頁。',
          }
          reference = None
          for tag, meta in manifest['languages'].items():
              raw = Path(meta['file']).read_bytes()
              decoded = gzip.decompress(raw)
              obj = json.loads(decoded.decode('utf-8'))
              assert meta['version'] == obj['version'] == 6, tag
              assert obj['locale'] == tag
              assert hashlib.sha256(raw).hexdigest() == meta['sha256']
              assert len(raw) == meta['size']
              assert len(decoded) == meta['uncompressedSize']
              translations = obj['translations']
              assert len(translations) == meta['translationCount'] == 2333, tag
              keys = set(translations)
              if reference is None: reference = keys
              else: assert keys == reference, tag
              if tag == 'zh-TW':
                  for key, value in expected_tw.items():
                      assert translations[key] == value, (key, translations[key])
          print('OK: 12 complete v6 packs, 2333 keys each, reported strings repaired')
          PY

      - name: Commit repaired packs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .fix324-i18n-trigger .fix324-i18n-trigger2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A manifest.json locales .fix324-i18n-trigger .fix324-i18n-trigger2
          git commit -m 'Repair reported UI translations and publish v6 [skip ci]'
          git push origin HEAD:"$GITHUB_HEAD_REF"
