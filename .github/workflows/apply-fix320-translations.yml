name: Apply FIX320 complete translations

on:
  pull_request:
    branches: [main]
    paths:
      - '.fix320-trigger/**'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Download verified FIX320 generated translations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .fix320
          curl --fail --location --retry 5 --retry-all-errors \
            -H 'Accept: application/vnd.github.raw+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/siusiu107/debugapk/contents/.fix320/generated_complete_translations.json?ref=main' \
            -o .fix320/generated_complete_translations.json
          test -s .fix320/generated_complete_translations.json
          python3 - <<'PY'
          import json
          data=json.load(open('.fix320/generated_complete_translations.json',encoding='utf-8'))
          assert data['version'] == 5
          assert data['exact'] and data['patterns']
          print(data['stats'])
          PY
      - name: Update and verify all language packs
        env:
          FIX320_TRANSLATIONS: ${{ github.workspace }}/.fix320/generated_complete_translations.json
        run: python3 tools/apply_fix320_translations.py
      - name: Commit all 12 packs and manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add manifest.json locales/*.json.gz FIX320_I18N_VERIFICATION.txt
          git commit -m 'Publish complete FIX320 language packs v5'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
