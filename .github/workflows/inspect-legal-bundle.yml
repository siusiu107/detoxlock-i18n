name: Inspect legal translation bundle

on:
  push:
    branches: [main]
    paths:
      - 'legal/INSPECT'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode verified bundle and record structure
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, json

          root = Path('legal')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          encoded = bytearray()
          verified_parts = []
          for item in manifest['parts']:
              path = root / item['file']
              raw = path.read_bytes()
              actual = hashlib.sha256(raw).hexdigest()
              assert actual == item['sha256'], (path.name, actual, item['sha256'])
              assert len(raw) == item['size'], (path.name, len(raw), item['size'])
              encoded.extend(raw)
              verified_parts.append({'file': path.name, 'size': len(raw), 'sha256': actual})

          compressed = base64.b64decode(bytes(encoded), validate=False)
          assert len(compressed) == manifest['decodedSize'], (len(compressed), manifest['decodedSize'])
          assert hashlib.sha256(compressed).hexdigest() == manifest['decodedSha256']
          decoded = gzip.decompress(compressed)
          document = json.loads(decoded.decode('utf-8'))

          candidates = []
          def walk(value, path=()):
              if isinstance(value, dict):
                  for key, child in value.items():
                      walk(child, path + (str(key),))
              elif isinstance(value, list):
                  for index, child in enumerate(value):
                      walk(child, path + (str(index),))
              elif isinstance(value, str) and ('<html' in value.lower() or '<!doctype html' in value.lower()):
                  candidates.append({
                      'path': list(path),
                      'length': len(value.encode('utf-8')),
                      'prefix': value[:180],
                  })
          walk(document)

          def shape(value, depth=0):
              if depth >= 4:
                  return type(value).__name__
              if isinstance(value, dict):
                  return {str(key): shape(child, depth + 1) for key, child in list(value.items())[:30]}
              if isinstance(value, list):
                  return [shape(child, depth + 1) for child in value[:5]]
              if isinstance(value, str):
                  return {'type': 'str', 'length': len(value), 'prefix': value[:80]}
              return {'type': type(value).__name__, 'value': value}

          report = {
              'verifiedParts': verified_parts,
              'decodedJsonSize': len(decoded),
              'rootType': type(document).__name__,
              'shape': shape(document),
              'htmlCandidates': candidates,
          }
          (root / 'bundle-inspection.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print('HTML candidates:', len(candidates))
          PY

      - name: Commit inspection report
        shell: bash
        run: |
          set -euo pipefail
          rm -f legal/INSPECT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A legal/INSPECT legal/bundle-inspection.json
          git commit -m 'Inspect verified legal translation bundle [skip ci]'
          git push origin HEAD:main
