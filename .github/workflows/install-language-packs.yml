name: Install DetoxLock language packs

on:
  push:
    paths:
      - DetoxLock_i18n_GitHub_upload_payload.zip
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract uploaded language packs
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f DetoxLock_i18n_GitHub_upload_payload.zip ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upload payload was found."
            exit 0
          fi
          unzip -o DetoxLock_i18n_GitHub_upload_payload.zip -d .
          rm DetoxLock_i18n_GitHub_upload_payload.zip
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Commit installed files
        if: steps.extract.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Install DetoxLock language packs [skip ci]"
          git push
