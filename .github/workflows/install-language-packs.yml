name: Install DetoxLock language packs

on:
  push:
    paths:
      - DetoxLock_i18n_GitHub_upload_payload.zip
      - .language-pack-upload/**
      - .language-pack-patch-v3/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-detoxlock-language-packs
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install full payload or verified delta
        id: install
        shell: bash
        run: |
          set -euo pipefail
          PAYLOAD="DetoxLock_i18n_GitHub_upload_payload.zip"
          CHANGED=false

          if [[ ! -f "$PAYLOAD" ]] && compgen -G '.language-pack-upload/part-*' > /dev/null; then
            mapfile -t PARTS < <(find .language-pack-upload -maxdepth 1 -type f -name 'part-*' | sort)
            cat "${PARTS[@]}" > "$PAYLOAD"
          fi

          if [[ -f "$PAYLOAD" ]]; then
            unzip -t "$PAYLOAD"
            unzip -o "$PAYLOAD" -d .
            rm -f "$PAYLOAD"
            rm -rf .language-pack-upload
            CHANGED=true
          elif [[ -f .language-pack-patch-v3/complete.json ]]; then
            python3 - <<'PY'
          import base64, gzip, hashlib, json, pathlib, zlib

          root = pathlib.Path('.')
          patch_dir = root / '.language-pack-patch-v3'
          complete = json.loads((patch_dir / 'complete.json').read_text(encoding='utf-8'))
          parts = sorted(patch_dir.glob('chunk-*.txt'))
          assert len(parts) == int(complete['parts']), (len(parts), complete['parts'])
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in parts)
          assert hashlib.sha256(encoded.encode('ascii')).hexdigest() == complete['sha256']
          delta = json.loads(zlib.decompress(base64.b64decode(encoded)).decode('utf-8'))

          manifest_path = root / 'manifest.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          languages = manifest['languages']
          assert set(delta) == set(languages)

          for locale, changes in delta.items():
              meta = languages[locale]
              pack_path = root / meta['file']
              old_raw = pack_path.read_bytes()
              assert hashlib.sha256(old_raw).hexdigest() == complete['baseHashes'][locale]
              pack = json.loads(gzip.decompress(old_raw).decode('utf-8'))
              translations = pack['translations']
              for key in changes.get('remove', []):
                  translations.pop(key, None)
              translations.update(changes.get('set', {}))
              pack['version'] = 3
              canonical = json.dumps(pack, ensure_ascii=False, sort_keys=True, separators=(',', ':')).encode('utf-8')
              new_raw = gzip.compress(canonical, compresslevel=9, mtime=0)
              pack_path.write_bytes(new_raw)
              meta.update({
                  'version': 3,
                  'sha256': hashlib.sha256(new_raw).hexdigest(),
                  'size': len(new_raw),
                  'translationCount': len(translations),
                  'encoding': 'gzip',
                  'uncompressedSize': len(canonical),
              })

          manifest['minAppVersionCode'] = 56
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
            rm -rf .language-pack-patch-v3
            CHANGED=true
          fi

          echo "changed=$CHANGED" >> "$GITHUB_OUTPUT"

      - name: Validate installed packs
        if: steps.install.outputs.changed == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip, hashlib, json, pathlib
          root = pathlib.Path('.')
          manifest = json.loads((root / 'manifest.json').read_text(encoding='utf-8'))
          languages = manifest['languages']
          assert len(languages) == 12
          key_sets = []
          for locale, meta in languages.items():
              assert int(meta['version']) >= 3, (locale, meta['version'])
              path = root / meta['file']
              raw = path.read_bytes()
              assert hashlib.sha256(raw).hexdigest() == meta['sha256'], locale
              assert len(raw) == int(meta['size']), locale
              pack = json.loads(gzip.decompress(raw).decode('utf-8'))
              translations = pack['translations']
              assert pack['locale'] == locale
              assert int(pack['version']) >= 3
              assert len(translations) == int(meta['translationCount']), locale
              assert not any(value is None or str(value).strip() == '' for value in translations.values())
              key_sets.append(set(translations))
          assert all(keys == key_sets[0] for keys in key_sets[1:])
          assert len(key_sets[0]) == 2143
          print(f"Validated {len(languages)} languages and {len(key_sets[0])} keys")
          PY

      - name: Commit installed files
        if: steps.install.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Install DetoxLock language packs v3 [skip ci]"
          git push
