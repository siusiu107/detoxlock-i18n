name: Install external legal HTML

on:
  push:
    branches: [main]
    paths:
      - 'language-upload/READY'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-external-legal-html
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify legal document payload
        shell: bash
        run: |
          set -euo pipefail
          test -s language-upload/READY
          mapfile -t PARTS < <(find language-upload -maxdepth 1 -type f -name 'part-*' | sort)
          test "${#PARTS[@]}" -eq 13
          cat "${PARTS[@]}" > /tmp/legal-html.zip.b64
          base64 --decode /tmp/legal-html.zip.b64 > /tmp/legal-html.zip
          echo '9210b4d463d4197f3ada9940e9a38b0a67e60daa5f563b548f1629e43e27a2b1  /tmp/legal-html.zip' | sha256sum -c -
          unzip -t /tmp/legal-html.zip

      - name: Install only non-English and non-Korean legal documents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/legal-html
          mkdir -p /tmp/legal-html
          unzip -q /tmp/legal-html.zip -d /tmp/legal-html
          mkdir -p legal/html
          find legal/html -maxdepth 1 -type f -name '*.html' -delete
          cp /tmp/legal-html/legal/html/*.html legal/html/
          python3 - <<'PY'
          from pathlib import Path
          allowed = {'ja','zh-CN','zh-TW','es','fr','de','pt-BR','id','vi','th'}
          files = sorted(Path('legal/html').glob('*.html'))
          assert len(files) == 20, len(files)
          for path in files:
              name = path.name
              tag = name.removesuffix('.html').split('.')[-1]
              assert tag in allowed, name
              assert path.stat().st_size > 1000, name
              text = path.read_text(encoding='utf-8')
              assert '<html' in text.lower(), name
          print('Verified', len(files), 'external legal documents')
          PY

      - name: Commit installed documents
        shell: bash
        run: |
          set -euo pipefail
          rm -rf language-upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A legal/html language-upload
          if ! git diff --cached --quiet; then
            git commit -m 'Publish external legal translations [skip ci]'
            git push origin HEAD:main
          fi
