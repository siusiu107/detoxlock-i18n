name: Install DetoxLock FIX318 v4 via PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.fix318-trigger/**'

permissions:
  contents: write

concurrency:
  group: install-detoxlock-fix318-i18n-v4-pr
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Generate and verify direct v4 packs
        run: python3 tools/install_fix318_v4.py

      - name: Publish direct v4 packs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Publish DetoxLock direct language packs v4'
          git push origin HEAD:main
