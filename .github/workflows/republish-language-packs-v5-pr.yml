name: Republish language packs v5 PR

on:
  pull_request:
    branches: [main]
    paths:
      - '.fix323-v5-pr-trigger/**'

permissions:
  contents: write

concurrency:
  group: republish-language-packs-v5-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  rebuild-verify-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Rebuild all language packs as v5
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json, re

          manifest_path = Path('manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          target_version = 5
          packs = {}
          for tag, meta in manifest['languages'].items():
              obj = json.loads(gzip.decompress(Path(meta['file']).read_bytes()).decode('utf-8'))
              translations = obj.get('translations', obj)
              assert isinstance(translations, dict), tag
              assert len(translations) == 2329, (tag, len(translations))
              assert all(isinstance(k, str) and isinstance(v, str) and v.strip() for k, v in translations.items()), tag
              packs[tag] = translations

          keys = set(packs['en'])
          token_re = re.compile(r'%(?:\d+\$)?[-#+0,(]*\d*(?:\.\d+)?[a-zA-Z%]|\{\d+\}')
          source_tokens = {key: sorted(token_re.findall(value)) for key, value in packs['en'].items()}
          for tag, translations in packs.items():
              assert set(translations) == keys, (tag, 'key set')
              for key, value in translations.items():
                  # hp_* entries are localized regular-expression source patterns,
                  # so their capture syntax legitimately differs by language.
                  if '.hp_' in key:
                      continue
                  assert sorted(token_re.findall(value)) == source_tokens[key], (tag, key, value)

          for tag, meta in manifest['languages'].items():
              payload = {
                  'schemaVersion': 1,
                  'locale': tag,
                  'version': target_version,
                  'translations': packs[tag],
              }
              decoded = json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode('utf-8')
              encoded = gzip.compress(decoded, compresslevel=9, mtime=0)
              Path(meta['file']).write_bytes(encoded)
              meta.update({
                  'version': target_version,
                  'sha256': hashlib.sha256(encoded).hexdigest(),
                  'size': len(encoded),
                  'translationCount': len(packs[tag]),
                  'encoding': 'gzip',
                  'uncompressedSize': len(decoded),
              })

          manifest['schemaVersion'] = 1
          manifest['minAppVersionCode'] = 56
          manifest_path.write_text(json.dumps(manifest, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          print('Rebuilt', len(packs), 'complete v5 packs')
          PY

      - name: Verify generated v5 files
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip, hashlib, json
          manifest = json.loads(Path('manifest.json').read_text(encoding='utf-8'))
          assert manifest['minAppVersionCode'] <= 57
          reference = None
          for tag, meta in manifest['languages'].items():
              raw = Path(meta['file']).read_bytes()
              decoded = gzip.decompress(raw)
              obj = json.loads(decoded.decode('utf-8'))
              assert meta['version'] == obj['version'] == 5, tag
              assert obj['locale'] == tag, tag
              assert hashlib.sha256(raw).hexdigest() == meta['sha256'], tag
              assert len(raw) == meta['size'], tag
              assert len(decoded) == meta['uncompressedSize'], tag
              translations = obj['translations']
              assert len(translations) == meta['translationCount'] == 2329, tag
              key_set = set(translations)
              if reference is None:
                  reference = key_set
              else:
                  assert key_set == reference, tag
          print('OK: 12 v5 packs, 2329 keys each, hashes and sizes verified')
          PY

      - name: Commit regenerated packs to PR branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .fix323-v5-pr-trigger .fix323-republish-v5
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A manifest.json locales .fix323-v5-pr-trigger .fix323-republish-v5
          git commit -m 'Republish complete language packs as v5 [skip ci]'
          git push origin HEAD:"$GITHUB_HEAD_REF"
